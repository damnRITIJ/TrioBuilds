AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Stubble Burning Early Warning System
  Lambda + EventBridge + S3 + SNS + Bedrock

# ── Parameters ─────────────────────────────────────────────────────────────────
Parameters:
  FirmsMapKey:
    Type: String
    Description: NASA FIRMS MAP_KEY (get free key at firms.modaps.eosdis.nasa.gov)
    NoEcho: true

  SnsBucketName:
    Type: String
    Default: stubble-warning-data
    Description: S3 bucket name for snapshot.json and static site

  SnsSubscriberEmail:
    Type: String
    Description: Email address to receive High-risk alerts

  BedrockModelId:
    Type: String
    Default: "anthropic.claude-3-haiku-20240307-v1:0"
    Description: Amazon Bedrock model ID for advisory generation

# ── Globals ────────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.12
    Timeout: 120
    MemorySize: 256
    Environment:
      Variables:
        S3_BUCKET: !Ref SnsBucketName
        SNS_TOPIC_ARN: !Ref AlertTopic
        FIRMS_MAP_KEY: !Ref FirmsMapKey
        BEDROCK_MODEL_ID: !Ref BedrockModelId

# ── Resources ──────────────────────────────────────────────────────────────────
Resources:

  # ── S3 Bucket (data + static site) ─────────────────────────────────────────
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SnsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SnsBucketName}/*"

  # ── SNS Topic ───────────────────────────────────────────────────────────────
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: stubble-warning-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref SnsSubscriberEmail

  # ── Lambda Function ─────────────────────────────────────────────────────────
  IngestAndScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: stubble-ingest-and-score
      CodeUri: ../backend/
      Handler: lambda_function.lambda_handler
      Description: "Ingests FIRMS + wind data, scores risk, generates advisory, writes snapshot.json"
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref SnsBucketName
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        # Runs every 2 hours automatically
        ScheduledRun:
          Type: Schedule
          Properties:
            Schedule: "rate(2 hours)"
            Name: stubble-warning-schedule
            Description: "Trigger ingest-and-score every 2 hours"
            Enabled: true

# ── Outputs ────────────────────────────────────────────────────────────────────
Outputs:
  LambdaFunctionArn:
    Description: ARN of the Lambda function
    Value: !GetAtt IngestAndScoreFunction.Arn

  S3WebsiteUrl:
    Description: Public URL of the static Leaflet map
    Value: !GetAtt DataBucket.WebsiteURL

  SnapshotUrl:
    Description: Direct URL of snapshot.json
    Value: !Sub "https://${SnsBucketName}.s3.amazonaws.com/snapshot.json"

  SnsTopicArn:
    Description: ARN of the SNS alert topic
    Value: !Ref AlertTopic
